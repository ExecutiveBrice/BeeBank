databaseChangeLog:
  - changeSet:
      id: 004-create-access-password
      author: beebank
      changes:
        - createTable:
            tableName: access_password
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: password
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
        - insert:
            tableName: access_password
            columns:
              - column:
                  name: id
                  valueNumeric: 1
              - column:
                  name: password
                  value: Bb2026
