databaseChangeLog:
  - changeSet:
      id: 007-create-balance-entry
      author: beebank
      changes:
        - createTable:
            tableName: balance_entry
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: player_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_balance_entry_player
                    references: player(id)
              - column:
                  name: failure_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_balance_entry_failure
                    references: failure(id)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: balance_entry
            indexName: idx_balance_entry_created_at
            columns:
              - column:
                  name: created_at
