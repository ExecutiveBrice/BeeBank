databaseChangeLog:
  - changeSet:
      id: 002-create-player
      author: beebank
      changes:
        - createTable:
            tableName: player
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: team
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
