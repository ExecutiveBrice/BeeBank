<main>
  <h1>Messages</h1>

  <form (submit)="addMessage(); $event.preventDefault()">
    <label for="message-text">Nouveau message</label>
    <div class="form-row">
      <input
        id="message-text"
        type="text"
        [value]="text()"
        (input)="updateText($event)"
        required
      >
      <button type="submit">Ajouter</button>
    </div>
  </form>

  @if (messages().length === 0) {
    <p>Aucun message.</p>
  } @else {
    <ul>
      @for (message of messages(); track message.id) {
        <li>
          <div>
            <p>{{ message.text }}</p>
            <time [attr.datetime]="message.createdAt">{{ message.createdAt | date: 'medium' }}</time>
          </div>
          <button type="button" (click)="deleteMessage(message.id)">Supprimer</button>
        </li>
      }
    </ul>
  }
</main>
