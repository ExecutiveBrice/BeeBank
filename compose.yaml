services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beebank}
      POSTGRES_USER: ${POSTGRES_USER:-beebank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beebank}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
